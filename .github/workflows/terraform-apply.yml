name: Terraform Apply

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write  # required for Workload Identity Federation

env:
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

jobs:
  apply:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform Toolchain
        uses: VFGROUP-NSE-NDPE/dne-pe-reusable-actions/actions/setup-terraform-toolchain@b6ce1eb21bd49556db7e1270b1d77169da2b6b99  # main, no tag
        with:
          terraform-version: '1.14.0'

      - name: Authenticate git for Terraform modules
        env:
          GH_MODULES_TOKEN: ${{ secrets.GH_MODULES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_MODULES_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Cache Terraform state
        uses: actions/cache@v4
        with:
          path: |
            infra/terraform.tfstate
            infra/terraform.tfstate.backup
          key: terraform-state-${{ github.run_id }}
          restore-keys: |
            terraform-state-

      - name: Terraform Init
        id: init
        run: terraform init -input=false -no-color 2>&1 | tee -a terraform_output.txt
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        if: steps.init.outcome == 'success'
        run: terraform apply -auto-approve -no-color -input=false 2>&1 | tee -a terraform_output.txt
        continue-on-error: true

      - name: Determine Outcome
        id: result
        if: always()
        run: |
          if [ "${{ steps.init.outcome }}" == "success" ] && [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Apply Comment
        if: always()
        uses: VFGROUP-NSE-NDPE/dne-pe-reusable-actions/actions/post-run-comment@b6ce1eb21bd49556db7e1270b1d77169da2b6b99  # main, no tag
        with:
          title: 'Terraform Apply'
          module: 'infra'
          outcome: ${{ steps.result.outputs.outcome }}
          output-file: infra/terraform_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
